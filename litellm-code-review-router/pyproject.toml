[project]
name = "litellm-code-review-router"
version = "0.1.0"
description = "Send the same code-review prompts to several OpenAI models through LiteLLM and compare cost and latency."
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.79",
    "python-dotenv>=1.2.3",
]

[project.scripts]
review-router = "review_router.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
