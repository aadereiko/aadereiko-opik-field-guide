[project]
name = "crewai-theater-production-crew"
version = "0.1.0"
description = "A CrewAI crew that plans a community-theater production, traced per kickoff with Opik"
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.17",
    "opik==2.3.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
theater-crew = "theater_crew.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theater_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
