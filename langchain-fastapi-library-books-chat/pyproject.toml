[project]
name = "langchain-fastapi-library-books-chat"
version = "0.1.0"
description = "Library book-recommendation chat: FastAPI + LangChain, one Opik thread per patron"
requires-python = ">=3.12"
dependencies = [
    "opik==2.3.4",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
