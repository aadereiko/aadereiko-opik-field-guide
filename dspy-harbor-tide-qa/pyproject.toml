[project]
name = "dspy-harbor-tide-qa"
version = "0.1.0"
description = "A DSPy QA program over a fictional harbor's tide tables that compiles its own prompt, measured by an Opik test suite."
requires-python = ">=3.12"
dependencies = [
    "dspy>=3.0",
    "opik==2.3.4",
    "python-dotenv>=1.0",
]

[project.scripts]
harbor-tide-qa = "harbor_tide_qa.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_tide_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
