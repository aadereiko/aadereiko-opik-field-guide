services:
  n8n:
    build: .
    container_name: n8n-makerspace-booking-review
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
